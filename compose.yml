# compose.yml
services:
    api:
        build:
            context: .
        image: atelier-vendredi-api:1.0
        container_name: atelier_node_api
        ports:
            # Port 3000 côté hôte -> API accessible sur http://localhost:3000
            - "${API_PORT}:3000"
        environment:
            PORT: 3000
            MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DATABASE}?authSource=admin
        depends_on:
            mongo:
                condition: service_healthy
        networks:
            - atelier_net
        restart: unless-stopped

    mongo:
        image: mongo:8.0
        container_name: atelier_mongo
        restart: unless-stopped
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
            MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
        ports:
            # 27018 côté hôte -> pas de conflit avec un MongoDB local
            - "${MONGO_PORT}:27017"
        volumes:
            - mongo_data:/data/db
        networks:
            - atelier_net
        healthcheck:
            test:
                [
                    "CMD",
                    "mongosh",
                    "--quiet",
                    "--eval",
                    "db.adminCommand('ping')",
                ]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    mongo_data:

networks:
    atelier_net:
        driver: bridge
